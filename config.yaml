# ============================================================
#  Channel identity
# ============================================================
channel:
  name: "Stack Signal"
  niche: "AI tools & automation"
  # Who you are talking to. Sharpens every script.
  audience: >
    Working professionals and solo builders who are not engineers but are
    tool-curious. They want to know what a tool actually does, whether it is
    worth switching to, and what it costs. They are tired of hype.
  # Things the channel will never do. Enforced by the quality gate.
  forbidden:
    - "Vague hype with no specific capability named"
    - "Claiming a tool does something not stated in the source material"
    - "Fake urgency ('this changes everything', 'nobody is talking about this')"
    - "Engagement bait ('comment X and I'll send you...')"
    - "Financial, legal, or medical advice"
    - "Naming a price or limit without it appearing in the source"

# ============================================================
#  Video format
#  Rotating formats are the primary defence against YouTube's
#  inauthentic-content policy: no two consecutive videos share
#  a structure, and a format cannot repeat within `cooldown` posts.
# ============================================================
video:
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 38        # sweet spot for retention on Shorts
  max_seconds: 58           # hard ceiling (Shorts eligibility)
  min_seconds: 20

formats:
  cooldown: 4               # a format cannot recur within N videos
  variants:
    - id: "teardown"
      label: "Single-tool teardown"
      structure: "Name the tool, the one job it does better than anything else, the catch, who should switch."
      beats: 4
      visual: "gradient_drift"
    - id: "compare"
      label: "Head-to-head"
      structure: "Two tools solving the same job. Pick a winner on a specific axis and justify it in one line."
      beats: 5
      visual: "split_slide"
    - id: "workflow"
      label: "Do-this-in-N-steps"
      structure: "A concrete outcome, then the numbered steps to get it. Every step names a real tool."
      beats: 5
      visual: "step_stack"
    - id: "mistake"
      label: "The thing people get wrong"
      structure: "A common misuse, why it fails, the correct approach, the measurable difference."
      beats: 4
      visual: "warn_pulse"
    - id: "news"
      label: "What shipped"
      structure: "What changed, what it replaces, who it matters to, what to do about it today."
      beats: 4
      visual: "ticker"

# ============================================================
#  Voice rotation (also anti-repetition)
# ============================================================
voice:
  provider: "elevenlabs"    # elevenlabs | openai | silent
  model: "eleven_turbo_v2_5"
  speed: 1.06
  cooldown: 2
  # ElevenLabs voice IDs. Replace with voices from your own account.
  pool:
    - id: "IKne3meq5aSn9XLyUdCD"
      label: "Charlie - conversational male"
    - id: "XB0fDUnXU5powFXDhCwa"
      label: "Charlotte - warm female"
    - id: "onwK4e9ZLuTAKqWW03F9"
      label: "Daniel - crisp British male"

# ============================================================
#  Topic discovery
# ============================================================
topics:
  # How many candidates to gather before ranking.
  pool_size: 60
  # No single feed may contribute more than this to the ranked pool.
  max_per_source: 8
  # Reject a topic too similar to anything published in the last N days.
  dedupe_days: 120
  similarity_threshold: 0.62
  max_age_days: 21
  sources:
    # Sources are chosen for ANGLE, not volume. A tutorial or release note has
    # no surprising claim to build a video on - the grader correctly scores a
    # script from one as a readback, because that is all it can be. Prefer
    # sources that argue, compare, or report a change with consequences.
    rss:
      # News and product changes
      - "https://techcrunch.com/category/artificial-intelligence/feed/"
      - "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
      - "https://venturebeat.com/category/ai/feed/"
      - "https://feeds.arstechnica.com/arstechnica/technology-lab"
      - "https://openai.com/news/rss.xml"
      # Opinionated practitioner writing - the richest source of angles,
      # because the author has already done the work of having a take.
      - "https://simonwillison.net/atom/everything/"
      - "https://www.oneusefulthing.org/feed"
      # Documentation-heavy. Kept for coverage, but capped like everything
      # else - it supplied 861 of ~2100 candidates on the first real run and
      # every script drawn from it was scored a readback.
      - "https://huggingface.co/blog/feed.xml"
    hackernews:
      enabled: true
      min_points: 120
      query: "AI OR LLM OR agent OR automation"
    github_trending:
      enabled: true
      language: "python"

# ============================================================
#  Quality gate - the thing standing between you and a strike
# ============================================================
quality:
  # THE BAR WAS LOWERED DELIBERATELY on 2026-09-11, after 27 graded attempts
  # across four runs produced zero passing scripts at 66/80/62/88.
  #
  # The trade made here is explicit: interestingness for volume, never accuracy.
  # hook_strength and originality came down, because a merely competent video is
  # still a video and this channel needs to exist before it can be good.
  # factual_grounding and policy_safety did NOT move, because two attempts
  # scoring 47 and 55 on grounding contained real inversions of their source -
  # one advised against a tool the article recommended. A channel that publishes
  # confident errors is worse than one that publishes nothing, and no amount of
  # throughput is worth that.
  #
  # Against the 27 observed attempts this bar passes 9 (33%) and still rejects
  # all 11 with grounding under 80.
  #
  # Raise hook_strength and originality back toward 66/62 once the channel has
  # retention data - `python run.py report` tells you which formats earn
  # attention, and that is a better guide than either of these numbers.
  min_score: 70
  max_retries: 1

  floors:
    # Lowered from 66. Observed median 60, so roughly half of attempts clear it.
    hook_strength: 58
    # UNCHANGED. This is the line that stops the channel publishing falsehoods.
    # Do not lower it to raise throughput.
    factual_grounding: 80
    # Lowered from 62. Observed median 57. This is the dimension the grader
    # complained about most, and the one this decision consciously concedes:
    # expect accurate, useful, unremarkable scripts.
    originality: 50
    # UNCHANGED. A genuine policy problem shows as a sharp drop, not a drift.
    policy_safety: 88

# ============================================================
#  Publishing
# ============================================================
publish:
  # Fully hands-off. Set to true to render + hold for review instead.
  dry_run: false
  platforms:
    youtube:
      enabled: true
      privacy: "public"
      category_id: "28"     # Science & Technology
      # YouTube's default API quota (10,000 units/day) allows ~6 uploads/day.
      max_per_day: 3
    tiktok:
      enabled: false        # requires an approved developer app - see README
      max_per_day: 3
    instagram:
      enabled: false        # requires PUBLIC_MEDIA_BASE_URL - see README
      max_per_day: 3
  # Local times, 24h. One video per slot.
  schedule:
    timezone: "America/New_York"
    slots: ["08:30", "13:00", "18:30"]

paths:
  out_dir: "out"
  assets_dir: "assets"
  db: "state.db"
